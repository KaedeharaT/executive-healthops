<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#20354c;font:14px/1.5 'Microsoft YaHei',sans-serif}
.scroll{overflow-x:auto;padding:8px 4px 14px;border-radius:12px;background:#f4f7fa;box-shadow:inset 2px 2px 7px #dde5ed,inset -2px -2px 7px #fff}
.axis{position:relative;min-height:300px}.label{position:sticky;left:12px;width:max-content;font-weight:600;background:#f4f7fa;padding:0 6px;color:#52677d;z-index:2}
svg{position:absolute;inset:0;pointer-events:none}.month{position:absolute;top:7px;font-size:12px;color:#52677d}
button{position:absolute;width:143px;padding:8px 9px 8px 20px;border:0;border-radius:8px;text-align:left;background:transparent;color:#20354c;font:inherit;cursor:pointer;min-height:60px}
button:before{content:'';position:absolute;left:5px;top:14px;width:8px;height:8px;border-radius:50%;background:#668eae;border:2px solid #f4f7fa;box-shadow:0 0 0 1px #668eae}
button:hover,button[aria-pressed=true]{background:#eaf1f8;box-shadow:3px 3px 7px #dce5ef,-3px -3px 7px white}button:focus-visible{outline:3px solid #327bc2;outline-offset:2px}
button b{display:block;font-size:13px;font-weight:600}button small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;color:#52677d}
button.attention:before{background:#b47523;box-shadow:0 0 0 1px #b47523}button.urgent:before{background:#b64743;box-shadow:0 0 0 1px #b64743}button.normal:before{background:#438264;box-shadow:0 0 0 1px #438264}
.hint{font-size:12px;color:#52677d;padding:6px 10px}
</style></head><body><div class="scroll" role="region" aria-label="纵向健康双轨时间轴" tabindex="0"><div class="axis" id="axis"></div></div><div class="hint">上轨：健康状态　下轨：管理行动　·　向右查看近期，点击节点展开下方详情</div><script>
const send=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type,...data},'*');let selected=null;
function render(entries){const axis=document.getElementById('axis'),scroll=document.querySelector('.scroll'),oldScroll=scroll.scrollLeft;axis.replaceChildren();
const months=[...new Set(entries.map(e=>e.date.slice(0,7)))],groups=months.map(m=>({month:m,state:entries.filter(e=>e.date.startsWith(m)&&e.track==='HEALTH_STATE'),care:entries.filter(e=>e.date.startsWith(m)&&e.track==='CARE_ACTION')}));
const top=65,step=75,stateCount=Math.max(1,...groups.map(g=>g.state.length)),careTop=top+stateCount*step+65,careCount=Math.max(1,...groups.map(g=>g.care.length)),height=careTop+careCount*step+18,width=Math.max(730,months.length*157+30),points={};axis.style.width=width+'px';axis.style.height=height+'px';
const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('width',width);svg.setAttribute('height',height);axis.append(svg);
for(const [text,y] of [['健康状态',35],['管理行动',careTop-30]]){const label=document.createElement('div');label.className='label';label.textContent=text;label.style.position='absolute';label.style.top=y+'px';axis.append(label);const line=document.createElementNS(ns,'line');for(const [k,v] of Object.entries({x1:88,x2:width-16,y1:y+12,y2:y+12,stroke:'#c8d6e3','stroke-width':1.5}))line.setAttribute(k,v);svg.append(line)}
groups.forEach((g,i)=>{let x=14+i*157;const month=document.createElement('span');month.className='month';month.style.left=x+'px';month.textContent=g.month;axis.append(month);for(const [items,y] of [[g.state,top],[g.care,careTop]])items.forEach((e,j)=>{const b=document.createElement('button');b.style.left=x+'px';b.style.top=y+j*step+'px';b.setAttribute('aria-label',e.title+' '+e.date);b.setAttribute('aria-pressed',String(e.key===selected));b.dataset.entry=e.key;if(e.risk)b.className=e.risk==='需关注'?'attention':e.risk==='优先处理'?'urgent':'normal';const title=document.createElement('b');title.textContent=e.title;const desc=document.createElement('small');desc.textContent=e.date.slice(5)+(e.risk?' · '+e.risk:'')+' · '+e.summary;b.append(title,desc);b.onclick=()=>{selected=e.key;render(entries);send('streamlit:setComponentValue',{value:e.key})};axis.append(b);points[e.key]={x:x+9,y:y+j*step+18,episode:e.episode};})});
const current=entries.find(e=>e.key===selected),ep=current?.episode;
for(const episode of new Set(entries.map(e=>e.episode).filter(Boolean))){
 const connected=entries.filter(e=>e.episode===episode);
 for(let i=1;i<connected.length;i++){
  const a=points[connected[i-1].key],b=points[connected[i].key],path=document.createElementNS(ns,'path');
  path.setAttribute('d',`M ${a.x} ${a.y} C ${a.x-25} ${a.y+25}, ${b.x-25} ${b.y-25}, ${b.x} ${b.y}`);
  path.setAttribute('stroke',ep===episode?'#789bb8':'#b9cbd9');path.setAttribute('stroke-width','1.5');
  path.setAttribute('fill','none');path.setAttribute('stroke-dasharray','4 4');svg.append(path);
 }
}
scroll.scrollLeft=oldScroll;send('streamlit:setFrameHeight',{height:height+62});}
window.addEventListener('message',event=>{if(event.data.type==='streamlit:render')render(event.data.args.entries||[])});send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
