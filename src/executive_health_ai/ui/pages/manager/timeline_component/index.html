<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#20354c;font:14px/1.6 'Microsoft YaHei',sans-serif}
:root{--line:#c8d6e3;--ink:#20354c;--muted:#52677d;--surface:#f4f7fa;--blue:#327bc2}
.hint{color:var(--muted);font-size:12px;margin:4px 0 16px}.timeline{padding:0 8px 12px 0}
.event{display:grid;grid-template-columns:95px 28px minmax(0,1fr);align-items:stretch;position:relative}
.date{font-size:12px;color:var(--muted);padding-top:15px}.spine{position:relative}
.spine:before{content:'';position:absolute;left:10px;top:0;bottom:0;border-left:2px solid var(--line)}
.event:first-child .spine:before{top:21px}.event:last-child .spine:before{bottom:auto;height:21px}
.dot{position:absolute;left:5px;top:17px;width:12px;height:12px;border-radius:50%;background:#668eae;border:2px solid var(--surface);box-shadow:0 0 0 1px #668eae}
.attention .dot{background:#b47523;box-shadow:0 0 0 1px #b47523}.urgent .dot{background:#b64743;box-shadow:0 0 0 1px #b64743}.normal .dot{background:#438264;box-shadow:0 0 0 1px #438264}
.surface{position:relative;margin:0 0 14px;padding:12px 18px;border-radius:12px;background:var(--surface);box-shadow:2px 2px 5px #dde5ed,-2px -2px 5px #fff;min-width:0}
h3{padding-right:120px;font-size:16px;line-height:1.45;margin:0 0 4px;font-weight:600}.summary{color:var(--ink);margin:0;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:12px;margin-top:4px;display:flex;flex-wrap:wrap;gap:12px}.result{margin-top:4px;color:var(--muted)}
.risk{font-weight:600}.attention .risk{color:#936020}.urgent .risk{color:#a53f3a}.normal .risk{color:#397055}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:24px;position:relative;margin:10px 0}.lane{border-left:3px solid #789bb8;padding:3px 0 3px 12px;position:relative}.lane:before{content:'';position:absolute;left:-3px;top:0;width:13px;border-top:2px solid #789bb8}.lane-care{border-color:#8b9ca9}.lane-title{display:block;font-size:12px;color:#52677d;margin-bottom:4px}.attention .surface{border-left:5px solid #9b6413}.urgent .surface{border-left:5px solid #ad3c36}.event[data-current="true"] .surface{border:2px solid #367652}.attention .risk,.urgent .risk,.normal .risk{padding:3px 9px;border:1px solid currentColor;border-radius:5px}.result{padding:8px 0;border-top:1px solid #dce5ef}
@media(max-width:650px){.tracks{grid-template-columns:1fr;gap:12px}}
button{font:inherit;cursor:pointer;color:#235d8f;background:transparent;border:0;border-radius:6px;min-height:36px;padding:4px 6px;text-align:left}button:hover{background:#eaf1f8}button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.toggle{position:absolute;right:12px;top:8px;font-size:12px;margin-top:0}.details{margin:12px 0 0;padding-top:8px;border-top:1px solid var(--line)}
.section{position:relative;margin:0 0 0 5px;padding:8px 0 12px 22px;border-left:1px solid var(--line)}
.section:before{content:'';position:absolute;left:0;top:21px;width:13px;border-top:1px solid var(--line)}
.section h4{margin:0 0 7px;font-size:14px;font-weight:600}.section p{margin:4px 0}.section:last-child{padding-bottom:0}
.steps{list-style:none;padding:0;margin:0}.steps li{margin:4px 0}.check{color:#397055;margin-right:8px}.muted{color:var(--muted);font-size:12px}
.actions{margin:0;padding:0;list-style:none}.action{border-left:1px solid var(--line);margin-left:4px;padding:3px 0 9px 18px;position:relative}.action:before{content:'';position:absolute;left:0;top:15px;width:12px;border-top:1px solid var(--line)}
.outcome{border-left:3px solid #84a494;padding:2px 0 2px 12px;margin-bottom:8px}.memory-label{color:#936020;font-size:12px}
table{border-collapse:collapse;width:100%;font-size:12px;margin:8px 0}th,td{text-align:left;padding:6px;border-bottom:1px solid #dee6ee}th{font-weight:500;color:var(--muted)}
.source{padding:7px 0;border-bottom:1px solid #dee6ee;overflow-wrap:anywhere}.source strong{font-size:12px}summary{cursor:pointer;color:#235d8f;min-height:36px;padding:5px 0}.drilldown{margin-top:8px}
@media(max-width:600px){.event{grid-template-columns:72px 21px minmax(0,1fr)}.surface{padding:10px}.date{font-size:11px}.section{padding-left:16px}.spine:before{left:8px}.dot{left:3px}.meta{gap:6px}th,td{padding:4px}body{font-size:14px}}
</style></head><body>
<p class="hint">从较早到最近 · 重要变化按同一管理过程合并，展开查看系统准备、人工行动和后续结果。</p>
<div id="timeline" class="timeline" role="region" aria-label="纵向重要健康事件时间轴"></div>
<script>
const send=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type,...data},'*');
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const action=(key,kind)=>send('streamlit:setComponentValue',{value:{key,action:kind,nonce:Date.now()}});
const lines=(parent,values)=>values.forEach(t=>parent.append(el('p',t)));
function section(parent,title){const n=el('section',undefined,'section');n.append(el('h4',title));parent.append(n);return n}
function details(parent,d,key){
 const box=el('div',undefined,'details');box.id='episode-details';parent.append(box);
 let s=section(box,'1. 当时的健康状态');lines(s,d.state);
 if(d.progress!==null&&d.progress!==undefined)s.append(el('p',`目标进度：${d.progress}%`));
 if(d.metrics.length){const table=el('table');table.setAttribute('aria-label','当时的关键指标');const head=el('tr');['指标','记录值','较年度基线','记录日期'].forEach(t=>head.append(el('th',t)));table.append(head);d.metrics.forEach(r=>{const tr=el('tr');[r.label,r.value,r.comparison,r.date].forEach(t=>tr.append(el('td',t)));table.append(tr)});s.append(table)}
 s=section(box,'2. 发生了什么变化');lines(s,d.changes);
 s=section(box,'3. 系统自动完成');const ul=el('ul',undefined,'steps');d.automatic.forEach(t=>{const li=el('li');li.append(el('span','·','check'),document.createTextNode(t));ul.append(li)});s.append(ul);
 s=section(box,'4. 为什么需要人工');s.append(el('p',d.human_reason));
 s=section(box,'5. 人工 / 医生做了什么');
 if(d.care.length){const actions=el('ol',undefined,'actions');d.care.forEach(r=>{const item=el('li',undefined,'action');item.append(el('span',r.date+' · '+r.title,'muted'),el('p',r.text));actions.append(item)});s.append(actions)}else s.append(el('p','暂无关联的人工行动记录。'));
 s=section(box,'6. 后续结果');
 if(d.outcomes.length)d.outcomes.forEach(r=>{const item=el('div',undefined,'outcome');item.append(el('strong',r.status),el('p',r.text),el('p',r.date+' · '+r.evidence,'muted'));s.append(item)});
 else s.append(el('p','结果待观察；尚无可核验的后续健康结果。'));
 s.append(el('p','观察到的变化不直接证明干预的因果效果；任务完成不等于健康改善。','muted'));
 s=section(box,'7. 长期管理经验');s.append(el('p',d.memory.status,'memory-label'),el('p',d.memory.text));
 if(d.memory.range)s.append(el('p','依据时间范围：'+d.memory.range,'muted'));if(d.memory.source)s.append(el('p',d.memory.source,'muted'));
 const links=el('div',undefined,'drilldown');box.append(links);
 if(d.metric){const trend=el('button','查看相关趋势');trend.onclick=()=>action(key,'trend');links.append(trend)}
 const sources=el('details');sources.append(el('summary','查看数据来源'));sources.setAttribute('aria-label','数据来源');
 d.sources.forEach(r=>{const item=el('div',undefined,'source');item.append(el('strong',r.label),el('p',r.text));if(r.original)item.append(el('p','原始记录：'+r.original,'muted'));sources.append(item)});
 if(!d.sources.length)sources.append(el('p','暂无完整来源记录。'));links.append(sources);
 const close=el('button','收起完整过程');close.onclick=()=>action(key,'close');links.append(close);
}
function render(args){const root=document.getElementById('timeline');root.replaceChildren();
(args.entries||[]).forEach(e=>{const expanded=args.detail?.key===e.key;const row=el('article',undefined,'event '+(e.risk==='需关注'?'attention':e.risk==='优先处理'?'urgent':e.risk==='正常'?'normal':''));row.dataset.current=String(e.current);row.dataset.title=e.title;
const date=el('time',e.date,'date');date.dateTime=e.date;const spine=el('div',undefined,'spine');spine.setAttribute('aria-hidden','true');spine.append(el('span',undefined,'dot'));
const body=el('div',undefined,'surface');body.append(el('h3',e.title));
const tracks=el('div',undefined,'tracks');tracks.setAttribute('aria-label','健康与管理双轨');
const health=el('div',undefined,'lane lane-health');health.append(el('strong','健康状态变化','lane-title'),el('p',e.summary,'summary'));
const care=el('div',undefined,'lane lane-care');care.append(el('strong','管理动作 / 医疗动作','lane-title'),el('p',e.care_summary||'暂无关联管理动作','summary'));
tracks.append(health,care);body.append(tracks);
const meta=el('div',undefined,'meta');meta.append(el('span',({'需关注':'需要您确认','优先处理':'需要优先处理','正常':'正常跟进'})[e.risk]||'管理记录','risk'),el('span',e.human));body.append(meta,el('p',(e.current?'下一步：':'结果：')+e.outcome,'result'));
const b=el('button',expanded?'收起完整过程':'查看完整过程','toggle');b.setAttribute('aria-label',e.title+' · '+e.date+' · '+(expanded?'收起完整过程':'查看完整过程'));b.setAttribute('aria-expanded',String(expanded));b.onclick=()=>action(e.key,expanded?'close':'select');body.append(b);
if(expanded)details(body,args.detail,e.key);row.append(date,spine,body);root.append(row)});
resize();}
function resize(){send('streamlit:setFrameHeight',{height:Math.ceil(document.body.getBoundingClientRect().height)+12})}
new ResizeObserver(resize).observe(document.body);
window.addEventListener('message',event=>{if(event.data.type==='streamlit:render')render(event.data.args)});
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
