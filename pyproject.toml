[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "executive-healthops"
version = "0.9.0"
description = "Proactive longitudinal HealthOps platform for reports, continuous health data, deterministic risk triage, care-team workflows, services, and long-term records"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pandas>=2.2,<3.0",
    "streamlit>=1.36,<2.0",
    # Imported directly by the Streamlit timeline and trend renderers; do not
    # rely on Streamlit's transitive dependency for the application contract.
    "altair>=5,<7",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "openpyxl>=3.1,<4.0",
    "pypdf>=5,<6",
    "python-docx>=1.1,<2",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
