[theme]
primaryColor = "#185da8"
backgroundColor = "#f0f5fa"
secondaryBackgroundColor = "#e6eef6"
# Native canvas table headers use a 60% tint of this color. Keep that tint readable;
# the surrounding application uses the shared #20354c ink token.
textColor = "#06182b"
font = "sans serif"

[client]
showErrorDetails = "none"
